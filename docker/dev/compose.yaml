# OpenCode development stack: the API server, the web UI dev server, and a tools service for
# one-off commands. Everything runs in containers with resource limits; nothing is installed on the
# host. See README.md in this folder.
name: opencode-dev

x-image: &image
  image: opencode-dev:local
  build:
    context: ../..
    dockerfile: docker/dev/Dockerfile
    target: dev
  init: true

services:
  server:
    <<: *image
    # bunfig.toml in packages/opencode must apply, so the server runs from that directory; serve.sh
    # also gives it the package's version (OpenCode Zen's free tier refuses "opencode/local").
    command: ["sh", "/opencode/docker/dev/serve.sh", "serve", "--hostname", "0.0.0.0", "--port", "4096"]
    # No port on the host: the browser reaches the API through the web server (one server, 4444), which
    # forwards it here inside Docker's network.
    environment:
      HOME: ${HOME:-/root}
      # Claude Code (`/merge claude`) uses your login and keeps its transcripts in your ~/.claude, as on the
      # host; a move takes the moved folder's transcripts along.
      CLAUDE_CONFIG_DIR: ${HOME:-/root}/.claude
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      # Operator → Projects → Add project browses and creates folders only inside these roots: your projects,
      # and ~/opencode-home, the working folder onboarding suggests.
      OPENCODE_WORKSPACE_ROOTS: ${WORKSPACE:-/root/projects}:${HOME:-/root}/opencode-home
      # A new installation asks for its working folder in the web UI (onboarding): every namespace but Global
      # lives there, at <working folder>/<namespace>, OpenCode at <working folder>/opencode, with a default
      # project made in it. Set OPENCODE_WORKING_DIR to set it on first start instead (no onboarding).
      OPENCODE_OPERATOR_WORKING_DIR: ${OPENCODE_WORKING_DIR:-}
    volumes:
      # Your whole home folder, at the same path as on the host (the production model; README.md): Global's
      # folder (~/.config/opencode), OpenCode's data and state, Claude Code's ~/.claude and the workspace
      # are one file system, so folders move between them and paths match the host's. The workspace
      # (WORKSPACE) must be inside it: a second mount would be another file system. For a stack that keeps
      # its data in volumes instead, add compose.isolated.yaml.
      - ${HOME:-/root}:${HOME:-/root}
    cpus: ${SERVER_CPUS:-4}
    mem_limit: ${SERVER_MEMORY:-6g}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4096/global/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    develop:
      watch:
        - { action: sync+restart, path: ../../packages/opencode/src, target: /opencode/packages/opencode/src }
        - { action: sync+restart, path: ../../packages/core/src, target: /opencode/packages/core/src }
        - { action: sync+restart, path: ../../packages/schema/src, target: /opencode/packages/schema/src }
        - { action: sync+restart, path: ../../packages/server/src, target: /opencode/packages/server/src }
        - { action: sync+restart, path: ../../packages/protocol/src, target: /opencode/packages/protocol/src }
        - { action: sync+restart, path: ../../packages/llm/src, target: /opencode/packages/llm/src }
        - { action: sync+restart, path: ../../packages/plugin/src, target: /opencode/packages/plugin/src }
        - { action: rebuild, path: ../../bun.lock }

  web:
    <<: *image
    # vite.dev-stack.config.ts: the app's config, forwarding the API to the server, so the app and the API
    # share one origin and Settings → Servers lists that one server.
    # Run on Node (/opt/node, Dockerfile), whose HTTP server lets the proxy forward WebSocket upgrades.
    working_dir: /opencode/packages/app
    command:
      [
        "/opt/node/bin/node",
        "node_modules/vite/bin/vite.js",
        "--config",
        "vite.dev-stack.config.ts",
        "--host",
        "0.0.0.0",
        "--port",
        "4444",
        "--strictPort",
      ]
    ports:
      - "127.0.0.1:${OPENCODE_WEB_PORT:-4444}:4444"
    environment:
      # The server the app talks to: the web server itself, at the address you open.
      VITE_OPENCODE_SERVER_HOST: ${OPENCODE_WEB_HOST:-127.0.0.1}
      VITE_OPENCODE_SERVER_PORT: ${OPENCODE_WEB_PORT:-4444}
      OPENCODE_DEV_API: http://server:4096
    depends_on:
      server:
        condition: service_healthy
    cpus: ${WEB_CPUS:-2}
    mem_limit: ${WEB_MEMORY:-3g}
    develop:
      watch:
        - { action: sync, path: ../../packages/app/src, target: /opencode/packages/app/src }
        - { action: sync, path: ../../packages/app/public, target: /opencode/packages/app/public }
        - { action: sync, path: ../../packages/ui/src, target: /opencode/packages/ui/src }
        - { action: sync, path: ../../packages/session-ui/src, target: /opencode/packages/session-ui/src }
        - { action: sync, path: ../../packages/sdk/js/src, target: /opencode/packages/sdk/js/src }
        - { action: rebuild, path: ../../bun.lock }

  # One-off commands against the image's copy of the source, for example:
  #   docker compose -f docker/dev/compose.yaml run --rm tools bun run --cwd packages/opencode typecheck
  # Run `docker compose -f docker/dev/compose.yaml build` first to pick up source edits.
  tools:
    <<: *image
    profiles: ["tools"]
    working_dir: /opencode
    command: ["bash"]
    volumes:
      - claude-config:/claude-config
    cpus: ${TOOLS_CPUS:-4}
    mem_limit: ${TOOLS_MEMORY:-6g}

  # Playwright browser tests for the web app against its mock server, for example:
  #   docker compose -f docker/dev/compose.yaml run --rm e2e npx playwright test e2e/operator
  e2e:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
      target: e2e
    image: opencode-dev-e2e:local
    profiles: ["e2e"]
    init: true
    shm_size: 1g
    environment:
      PLAYWRIGHT_WORKERS: ${E2E_WORKERS:-2}
    command: ["npx", "playwright", "test", "--reporter=line"]
    cpus: ${E2E_CPUS:-4}
    mem_limit: ${E2E_MEMORY:-6g}

# The one-off services' Claude Code login and transcripts. (Isolated mode declares the server's volumes.)
volumes:
  claude-config:
